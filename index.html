<head>
  <title>Gaming Catalog</title>
  <link rel="icon" href="public/favicon.ico">
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
      <img src="/logo.png" alt="Gaming Catalog logo" class="logo">
      <div class="brand-title">Gaming Catalog Web App</div>
      <form class="searchbar" id="searchForm">
        <input id="searchInput" type="search" placeholder="Search a game..." autocomplete="off" />
        <button class="btn" type="submit">Search</button>
      </form>
      
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Favorites</h2>
    <section class="favorites-grid" id="favoritesGrid"></section>

    <h2 class="section-title">Results</h2>

<div class="results-layout">
  <aside class="filters-panel">
      <label>
      Genre:
      <select id="genreSelect">
        <option value="">All</option>
      </select>
    </label>
    <label>
      Sort:
      <select id="sortSelect">
        <option value="">Relevance</option>
        <option value="-rating">Top Rated</option>
        <option value="-first_release_date">Newest</option>
        <option value="name">A-Z</option>
      </select>
    </label>

    <label>
      Platform:
      <select id="platformSelect">
        <option value="">All</option>
        <option value="6">PC (Windows)</option>
        <option value="48">PlayStation 4</option>
        <option value="49">Xbox One</option>
        <option value="130">Nintendo Switch</option>
      </select>
    </label>
  </aside>

  <section class="grid" id="resultsGrid"></section>
</div>

    <p id="statusText" class="section-title"></p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
